    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-radius: 20px;
            --accent-color: #cbd5e1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 
                        0 4px 12px -4px rgba(0, 0, 0, 0.03);
            padding: 36px;
            border-top: 12px solid var(--accent-color);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .header-section {
            margin-bottom: 28px;
        }

        .date-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        h1 {
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.25;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
        }

        .color-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid #e2e8f0;
        }

        .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top: 1px solid #f1f5f9;
            padding-top: 24px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 32px 1fr;
            align-items: flex-start;
        }

        .info-icon {
            font-size: 1.25rem;
            margin-top: 2px;
        }

        .info-body h3 {
            margin: 0 0 4px 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-body p {
            margin: 0;
            color: #334155;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Error Box Styling */
        .error-box {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>

        function renderDashboard() {
            const card = document.getElementById("liturgical-card");
            const display = document.getElementById("card-content");

            try {
                // 2. Completely cross-browser safe date conversion
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const today = new Date();
                
                const currentMonth = months[today.getMonth()];
                const currentDay = today.getDate();
                const formattedDate = currentMonth + " " + currentDay; // Matches exactly: "October 22"

                // 3. Extract entry from database
                const data = liturgicalDatabase[formattedDate];

                // 4. Handle clean missing/Ordinary Time fallbacks
                if (!data) {
                    card.style.setProperty('--accent-color', '#cbd5e1');
                    display.innerHTML = `
                        <div class="header-section">
                            <div class="date-badge">${formattedDate}</div>
                            <h1>Ordinary Time</h1>
                            <p style="color: var(--text-muted)">There are no major feast days or solemnities mapped to this calendar date today.</p>
                        </div>
                    `;
                    return;
                }

                // 5. Update look elements dynamically
                const themeColor = colorPalette[data.color] || "#cbd5e1";
                card.style.setProperty('--accent-color', themeColor);

                // 6. Push data structures to screen layout
                display.innerHTML = `
                    <div class="header-section">
                        <div class="date-badge">${formattedDate}</div>
                        <h1>${data.name}</h1>
                        <div class="color-pill">
                            <span class="color-dot"></span>
                            <span>${data.liturgical_color} Vestments</span>
                        </div>
                    </div>

                    <div class="info-grid">
                        <div class="info-row">
                            <div class="info-icon">✨</div>
                            <div class="info-body">
                                <h3>Significance</h3>
                                <p>${data.significance}</p>
                            </div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-icon">📜</div>
                            <div class="info-body">
                                <h3>History & Origin</h3>
                                <p>${data.history}</p>
                            </div>
                        </div>

                        <div class="info-row">
                            <div class="info-icon">⛪</div>
                            <div class="info-body">
                                <h3>Liturgical Ceremonies</h3>
                                <p>${data.ceremonies_associated}</p>
                            </div>
                        </div>

                        <div class="info-row">
                            <div class="info-icon">🙏</div>

                                <h3>Devotional Practices</h3>
                                <p>${data.practices_associated}</p>
                            </div>
                        </div>
                    </div>
                `;

                // Catch-all system to explicitly show bugs if they happen
                display.innerHTML = `
                    <div class="error-box">
                        <strong>An error occurred loading the script:</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        // Run dashboard loader
        renderDashboard();
