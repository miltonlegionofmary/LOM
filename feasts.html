<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgical Year Calendar & Database</title>
    <style>
        :root {
            --bg-canvas: #f4f5f6;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .split-viewport {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 600px;
        }

        @media (min-width: 992px) { .split-viewport { grid-template-columns: 40% 60%; } }

        .image-pane { position: relative; background-color: #cbd5e1; min-height: 400px; }
        .image-pane img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .color-banner { position: absolute; bottom: 0; left: 0; right: 0; height: 12px; border-top: 1px solid rgba(0,0,0,0.1); }

        .data-pane { padding: 3rem; display: flex; flex-direction: column; max-height: 80vh; overflow-y: auto; }
        .meta-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .date-marker { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .color-badge { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 0.25rem 0.75rem; border-radius: 4px; border: 1px solid var(--border-color); }
        .lit-name { font-size: 1.5rem; color: #0f172a; line-height: 1.2; margin-bottom: 1.5rem; font-family: Georgia, serif; }

        .schema-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
        .schema-section:last-of-type { border-bottom: none; margin-bottom: 0; }
        .schema-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 0.25rem; }
        .schema-value { font-size: 1.05rem; color: var(--text-main); }

        .navigation-bar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 3rem; background: #f8fafc; border-top: 1px solid var(--border-color); }
        .nav-button { background: #0f172a; color: #ffffff; border: none; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s ease; }
        .nav-button:hover { background: #334155; }
    </style>
</head>

    "10-28": {
        "name": "Feast of Our Lady of Vivonne",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Vivonne' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "According to tradition, a farmer was plowing his field when he overturned something peculiar in the sod. To his great surprise, the man found the object was a statue of the Blessed Virgin Mary. The good farmer took the statue now known as Our Lady of Vivonne, or Notre-Dame de Vivonne, that he had found back to his home. After lovingly cleaning the debris from the statue, the farmer took the statue to the local church and gave it to the pastor of the parish. The pastor immediately placed the statue that had just been discovered in the church later that same day. The next morning when the priest returned to the church, he found that the statue was missing. After much inquiry and searching for the statue, the farmer found the statue was once again in his field. The man returned the statue to the church, but once again it disappeared from its place, only to be found again in the field. This occurred a total of three times before it was decided to build a shrine in the field where the statue had first been found. The strange phenomenon brought people from near and far to the shrine. Soon the image proved to be miraculous and pilgrimages were formed. The church which was built to honor the image of Our Lady was given to the Carmelite Order.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Lighting votive candles, meditating on Mary's hidden life, reciting the Litany of Loreto, and acts of charity.",
        "image": "images/October_28.jpg"
    },
    "10-29": {
        "name": "Feast of Our Lady of Oropa ",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Our Lady of Oropa image (also known as the Black Madonna of Oropa) is a revered 13th-century wooden statue housed in the Ancient Basilica at the Sanctuary of Oropa near Biella, Piedmont, Italy.",
        "history": "Saint Eusebius who had been exiled into Syria because of his differences with the Arians, died in the year 370. While in exile, the Emperor Constantine permitted him some freedom. Eusebius discovered among some ruins in Jerusalem three statues of Our Lady. On his triumphant return after the Arians had been temporarily overthrown, he gave two of the statues away. The third he kept for himself, placing it in a little hermitage at Oropa which he often visited.In the 5th and 6th centuries when Arianism again reared its ugly head, the faithful Catholics took refuge at the shrine of Our Lady of Oropa.At one time it was decided to transport the statue to another place. As the procession marched along, the statue became so heavy that the men who carried it could not move on. Only when they decided to take Our Lady back to her original shrine at Oropa were they able to move.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "The chapel of Our Lady of Oropa is a beautiful one and thousands of pilgrims today make their way there as they have done over the centuries.Small replicas and hand-painted resin or marble-resin statues are widely available through religious retailers like Holyart in sizes ranging from 15 cm to 20 cm.",
        "image": "images/October_29.jpg"
    },
    "10-30": {
        "name": "Feast of Our Lady of Mondevi ",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "• The original image was painted around 1540 on a pillar by a local charcoal burner or tile-maker.It traditionally depicts the Annunciation (or the Virgin Mary), though the original artwork has been heavily restored and almost completely repainted during 20th-century restorations..",
        "history": " Following a child-rescue miracle in 1644, Maria Cristina of France commissioned a church around 1645 to enclose the pillar and miraculous image, which was later completed around 1730 and expanded in subsequent years..",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Lighting votive candles, meditating on Mary's hidden life, reciting the Litany of Loreto, and acts of charity.",
        "image": "images/October_30.jpg"
    },
    "10-31": {
        "name": "Feast of Our Lady of St Fort Chartres ",
        "liturgical_color": "White (Standard Marian Color)",
        "significance":"Veneration of Mary under the local or historical title of 'Our Lady of Walsingham' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "The Well of Saint's Fort is from the ancient name of Locus Fortis, or The Strong Place. It used to be located outside the old, smaller church, and is where the bodies of the martyrs Saint Altin and Saint Eodald were thrown by the Vikings in a raid in the year 858. The well was filled in about the 17th century, but it has been restored, as the earth was removed again in 1901.They found there a statue of a woman seated upon a throne with a child on her knee, a statue that had been venerated by the Druids. It appears that they were aware of Isaiah's prophesy that a virgin would conceive and bear a son. The statue was described by a 17th century thus,“The Virgin sits on a chair, her Son sits on her knees and He gives the sign of blessing with His right hand. In His left hand He holds an orb. He is bare-headed and His hair is quite short. He wears a close-fitting robe girdled with a belt. His face, hands and feet are bare and they are of a shining grey-ebony color. Virgin is dressed in an antique mantle in the shape of a chasuble. Her face is oval, of perfect construction, and of the same shining black color. Her crown is very plain, only the top being decorated with flowers and small leaves. Her chair is one foot wide with four parts hallowed out at the back and carved. The statue is twenty-nine inches tall.'It is interesting to note that the eyes of the Divine Child were open, while the Madonna's eyes were closed. According to Cecil Headlam, the Druids “intended by this device to signify that faith was still in darkness, and that she whom they worshipped was not yet born. But the eyes of the Child, whom she in the fullness of time should supernaturally conceive and bear, were open; for He was without beginning and without end, the Spectator of all time and all existence.'The statue survived the centuries until the year 1793, when it was burned during the Reign of Terror during the French Revolution. The people rose up to defend their cathedral, and so the Cathedral of Chartres was not destroyed, although the crypt was used as a warehouse until the year 1857. The statue was then replaced with the copy that can currently been seen in the crypt.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Lighting votive candles, meditating on Mary's hidden life, reciting the Litany of Loreto, and acts of charity.",
        "image": "images/October_31.jpg"
    },
    "11-01": {
        "name": "Feast of Our Lady of the Palm (Virgen de la Palma) (Cádiz, Spain) ",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary A historic, dressed wooden processional statue carved in the 18th century, housed in the Palm Church in Cádiz",
        "history": "On November 1, 1755, following the devastating Great Lisbon Earthquake, a massive tidal wave exceeding 90 feet in height bore down directly on the seaport of Cádiz, Spain. Terrified residents prepared to abandon the city when two unidentified men—later believed to be the city's patron saints—closed the water gates and urged the crowd toward the Capuchin Church of Our Lady of the Palm. Inside, as Mass was concluding, the priest seized a banner bearing the image of Our Lady and marched out to confront the advancing wall of water. Planting the banner in the flooded street before the encroaching ocean, he cried out, “Thus far, my Mother!” The deluge stopped at the exact line of the banner, and as the priest stepped forward into the surge with the image, the towering waters retreated back to the sea",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "To commemorate the deliverance, a confraternity was formed and an annual anniversary procession was established. Except in 1837 during civil unrest, the procession moves through Cádiz to the historic seawall every year, where the Rosary and prayers of thanksgiving are offered along the path of the wave and the ocean is solemnly blessed with holy water.",
        "image": "images/November_1.jpg"
    },

    "11-03": {
        "name":"Feast of Our Lady of Rennes / Notre-Dame des Miracles (Brittany, France)",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Montserrat' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "This shrine in Brittany honors the Mother of God for delivering the town of Rennes during a wartime siege. In February 1357, during an English siege, church bells began ringing unassisted while chapel candles ignited spontaneously. Citizens observed the stone statue extending its arm and pointing downward. Digging at the spot indicated by the Virgin, townsfolk uncovered a secret military tunnel beneath the sanctuary floor, thwarting an imminent surprise assault and alerting the community to an explosive mine.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Solemn candlelit processions around the sanctuary wall; pilgrims offer small votive stone shields to commemorate the protection of the town.",

    "11-04": {
        "name": "Feast of Our Lady of Port Louis (Mauritius)",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Akita' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": " Erected in 1940 by the local bishop to place the island under Mary's protection during World War II, the statue quickly became an enduring national monument of peace, unity, and safety. Tradition reports that this sanctuary originally received the homage of angelic visitants. According to tradition, a pious monk named Herman experienced a vision where Our Lady appeared flanked by two angels, symbolic of a mystical betrothal and entrusting the Christ Child to his care under the name Herman-Joseph.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Thousands of pilgrims walk a steep uphill path to the monument site to offer massive banks of tropical flowers at the foot of the marble base.",
        "image": "images/November_4.jpg"
    },
    "11-05": {
        "name": "Feast of  Our Lady of Damietta (Egypt) ",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Altötting' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "This miraculous shrine was consecrated in 1220 by Pelagius, apostolic legate. Situated at the mouth of the Nile, Damietta saw historical preservation during the medieval crusades, supported by figures like St. Louis IX and St. Francis of Assisi.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Scenting of the icon with traditional frankincense and the chanting of ancient Coptic liturgical hymns.",

    "11-06": {
        "name": "Feast of  Our Lady of Good Remedies (Mexico)",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Beauraing' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "During the retreat from Tenochtitlan in 1520 (the Noche Triste), the statuette was hidden within the roots of a giant Maguey cactus. Over twenty years later, Aztec convert John the Eagle was miraculously cured by Our Lady after being crushed by a stone pillar. Directed by her voice and visions, he uncovered the statue in the roots and eventually built her sanctuary directly on the site in 1574.",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "Venerated as 'The Little Lady of the Rain' at her sanctuary. Pilgrims bring small polished stones, field fruits, and floral crowns, invoking her for relief from droughts during processions.",
        "image": "images/November_6.jpg"

    "11-07": {
        "name": "Feast of Our Lady of Suffrage / Our Lady of the Poor Souls (Rome, Italy) ",
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Tied to the Roman Archconfraternity established in 1592, this feast honors Mary as advocate for the Holy Souls in Purgatory. As noted by St. Alphonsus Liguori, St. Brigid, and St. Peter Damian, Mary's maternal intercession offers solace and deliverance to departed souls.",

    "11-08": {
        "name": "Feast of Our Lady of Fair Mountain / Our Lady of Prayer (Bitterroot Valley, Montana, USA / La Rochelle, France)",

        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Good Success' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "In the Rocky Mountains ('shining hills'), Fr. Pierre-Jean De Smet established St. Mary's Mission. On Christmas Eve 1841, an orphan boy named Paul witnessed a radiant vision of the Virgin Mary standing over a serpent. By 1842, Fr. De Smet inaugurated the Marian devotion known as 'Our Lady of Prayer'.",

        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",

    "11-09": {
        "name": "Feast of Our Lady of Almudena (Madrid, Spain)",
 
        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of La Salette' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "Hidden inside Madrid's city walls in 714 AD during the Moorish invasion, the statue remained concealed for centuries. On November 9, 1085, after King Alfonso VI reconquered the city and held a public novena, a section of the rampart (Al-Mudayna) crumbled to reveal the image intact with burning oil lamps. Alfonso VI built a larger church for the image, and in 1664 municipal celebrations were formalized..",
        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",
        "practices_associated": "A major statutory holiday in Madrid. The statue is carried through floral tapestry-covered streets, accompanied by public acts of devotion presenting a golden rose.",

        "image": "images/November_9.jpg"

    "11-11": {

        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Mount Carmel' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "Commemorates a victory on November 11, 1546, during the siege of Diu Fortress. In 1646, King John IV placed his royal crown at the feet of Our Lady, declaring her permanent Queen of Portugal, leading Portuguese monarchs to cease wearing crowns.",

        "ceremonies_associated": "Votive masses of the Blessed Virgin Mary, local parish processions, and sanctuary chaplet recitations.",

    "11-12": {
        "name": "Feast of Our Lady of the Tower Secret (Turin, Italy)",

        "liturgical_color": "White (Standard Marian Color)",
        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Angels' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": "In 1863, Don Bosco began building the basilica relying on small offerings. The finished church features a right-hand tower depicting an angel offering an un-inscribed crown, symbolizing future spiritual triumphs alongside the Lepanto victory tower on the left. It was raised to a minor basilica by St. Pope Pius X.",

    "11-13": {

        "significance": "Veneration of Mary under the local or historical title of 'Our Lady of Divine Providence' honoring her continuous intercession across historical Christian sanctuaries.",
        "history": " Dating to the 1st century, local believers discovered a statue on an oak tree near a spring. Famous for miraculous cures of sick and crippled children, the shrine was favored by Venerable Olier and St. Benedict Joseph Labre.",

        const colorHexMap = {
            "White": "#f8fafc", "Red": "#dc2626", "Green": "#16a34a", 
            "Violet": "#6b21a8", "Rose": "#f472b6", "Black": "#0f172a"
        };

        const databaseKeys = Object.keys(liturgicalDatabase);
        let pointerIndex = 0;

        // Clean numerical extraction eliminates timezone string bugs entirely
        function getSystemDateKey() {
            const today = new Date();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${mm}-${dd}`;
        }

        function renderActiveItem() {
            if (!databaseKeys.length) return;
            
            const activeKey = databaseKeys[pointerIndex];
            const item = liturgicalDatabase[activeKey];
            if (!item) return;
            
            const hexColor = colorHexMap[item.liturgical_color] || "#cbd5e1";

            document.getElementById('lit-name').textContent = item.name;
            document.getElementById('lit-date').textContent = `Calendar Day: ${activeKey}`;
            document.getElementById('lit-significance').textContent = item.significance || "";
            document.getElementById('lit-history').textContent = item.history || "";
            document.getElementById('lit-ceremonies').textContent = item.ceremonies_associated || "";
            document.getElementById('lit-practices').textContent = item.practices_associated || "";

            const badge = document.getElementById('lit-color-badge');
            if (badge) {
                badge.textContent = item.liturgical_color;
                badge.style.backgroundColor = hexColor;
                badge.style.color = (item.liturgical_color === 'White' || item.liturgical_color === 'Rose') ? '#1e293b' : '#ffffff';
            }
            
            if (document.getElementById('lit-color-banner')) {
                document.getElementById('lit-color-banner').style.backgroundColor = hexColor;
            }

            const imgEl = document.getElementById('lit-image');
            
const captionEl = document.getElementById('lit-caption'); // Selects the caption placeholder

if (imgEl) {
    imgEl.src = item.image || "";
    imgEl.alt = item.alt || "";
    
    // Ensures the image fills the container and crops cleanly if needed
    imgEl.style.width = "100%";
    imgEl.style.height = "100%";
    imgEl.style.objectFit = "contain"; 
}
if (captionEl) {
    captionEl.textContent = item.alt || ""; // Uses the alt text as the visible caption
}
                imgEl.onerror = function() {
                    this.onerror = null; 
                    this.src = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23e2e8f0'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='8' fill='%2394a3b8'>Image Asset Not Found</text></svg>";
                };
            }
        

        function navigateDays(offset) {
            if (!databaseKeys.length) return;
            pointerIndex += offset;
            if (pointerIndex >= databaseKeys.length) pointerIndex = 0;
            if (pointerIndex < 0) pointerIndex = databaseKeys.length - 1;
            renderActiveItem();
        }

        function forceSystemLoad() {
            if (!databaseKeys.length) return;
            const todayKey = getSystemDateKey();
            const matchingIndex = databaseKeys.indexOf(todayKey);
            
            // If today doesn't match an active entry, default to index 0 smoothly
            pointerIndex = (matchingIndex !== -1) ? matchingIndex : 0;
            renderActiveItem();
        }

        // Fired instantly when elements load
        window.addEventListener('DOMContentLoaded', forceSystemLoad);
    </script>
